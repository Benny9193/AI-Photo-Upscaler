<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Enhancer</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --ink: #1c1b19; --muted: #6b6760;
    --line: #e3e0da; --accent: #3b5bdb; --accent-ink: #ffffff; --danger: #c92a2a;
    --checker: #eceae5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151513; --panel: #1e1e1b; --ink: #ecebe7; --muted: #9a968e;
      --line: #33322e; --accent: #7b93f5; --accent-ink: #0f1020; --danger: #ff6b6b;
      --checker: #26261f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
    padding: 20px 24px 8px;
  }
  h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  header .note { color: var(--muted); font-size: 13px; }
  main {
    display: grid; grid-template-columns: 300px 1fr; gap: 20px;
    padding: 12px 24px 24px; align-items: start;
  }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; padding: 12px 16px; } header { padding: 16px 16px 4px; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  label.field { display: block; margin: 0 0 14px; font-size: 13px; color: var(--muted); }
  label.field span.val { float: right; color: var(--ink); font-variant-numeric: tabular-nums; }
  select, input[type=range] { width: 100%; margin-top: 4px; }
  select {
    font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 8px;
  }
  input[type=range] { accent-color: var(--accent); }
  .model-desc { font-size: 12px; color: var(--muted); margin: -8px 0 14px; }
  .presets { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .chip {
    font: inherit; font-size: 13px; padding: 4px 10px; border-radius: 999px; cursor: pointer;
    background: transparent; color: var(--ink); border: 1px solid var(--line);
  }
  .chip:hover { border-color: var(--accent); }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 0 10px; }
  h2:first-child { margin-top: 0; }
  button.primary {
    width: 100%; font: inherit; font-weight: 600; padding: 10px; border: 0; border-radius: 8px;
    background: var(--accent); color: var(--accent-ink); cursor: pointer;
  }
  button.primary:disabled { opacity: .5; cursor: default; }
  .status { font-size: 13px; color: var(--muted); margin-top: 10px; min-height: 20px; }
  .status.error { color: var(--danger); }
  .bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin-top: 8px; }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }

  #drop {
    border: 2px dashed var(--line); border-radius: 12px; min-height: 420px;
    display: flex; align-items: center; justify-content: center; text-align: center;
    color: var(--muted); cursor: pointer; padding: 24px; background: var(--panel);
  }
  #drop.over { border-color: var(--accent); color: var(--ink); }
  #drop strong { color: var(--ink); display: block; font-size: 17px; margin-bottom: 4px; }

  #viewer { display: none; }
  .compare {
    position: relative; overflow: hidden; border-radius: 12px; border: 1px solid var(--line);
    user-select: none; touch-action: none; cursor: ew-resize;
    background: repeating-conic-gradient(var(--checker) 0 25%, transparent 0 50%) 0 0 / 20px 20px;
  }
  .compare img { display: block; width: 100%; height: auto; image-rendering: auto; }
  .compare .before { position: absolute; inset: 0; clip-path: inset(0 50% 0 0); }
  .compare .before img { width: 100%; height: 100%; object-fit: fill; image-rendering: pixelated; }
  .compare .handle { position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.3); }
  .compare .tag {
    position: absolute; top: 10px; font-size: 12px; padding: 2px 8px; border-radius: 6px;
    background: rgba(0,0,0,.55); color: #fff;
  }
  .compare .tag.l { left: 10px; } .compare .tag.r { right: 10px; }
  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 12px; font-size: 13px; color: var(--muted); }
  .toolbar .spacer { flex: 1; }
  .toolbar a, .toolbar button {
    font: inherit; font-size: 13px; color: var(--ink); background: var(--panel); text-decoration: none;
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer;
  }
  .toolbar a.dl { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .toolbar a[aria-disabled=true] { opacity: .4; pointer-events: none; }
</style>
</head>
<body>
<header>
  <h1>Photo Enhancer</h1>
  <span class="note" id="env">Runs entirely on this computer.</span>
</header>
<main>
  <form class="panel" id="form">
    <h2>Presets</h2>
    <div class="presets">
      <button type="button" class="chip" data-preset="upscale">Upscale only</button>
      <button type="button" class="chip" data-preset="auto">Auto enhance</button>
      <button type="button" class="chip" data-preset="old">Old photo</button>
      <button type="button" class="chip" data-preset="lowlight">Low light</button>
    </div>

    <h2>Upscaling</h2>
    <label class="field">Model
      <select name="model" id="model"></select>
    </label>
    <div class="model-desc" id="model-desc"></div>
    <label class="field">Scale
      <select name="scale" id="scale">
        <option value="1">1× (enhance, same size)</option>
        <option value="2">2×</option>
        <option value="3">3×</option>
        <option value="4" selected>4×</option>
      </select>
    </label>

    <h2>Adjustments</h2>
    <label class="field">Denoise <span class="val"></span><input type="range" name="denoise" min="0" max="1" step="0.05" value="0"></label>
    <label class="field">White balance <span class="val"></span><input type="range" name="white_balance" min="0" max="1" step="0.05" value="0"></label>
    <label class="field">Contrast <span class="val"></span><input type="range" name="contrast" min="0" max="1" step="0.05" value="0"></label>
    <label class="field">Saturation <span class="val"></span><input type="range" name="saturation" min="-1" max="1" step="0.05" value="0"></label>
    <label class="field">Sharpen <span class="val"></span><input type="range" name="sharpen" min="0" max="1" step="0.05" value="0"></label>
    <label class="field">Output format
      <select name="format">
        <option value="png">PNG (lossless)</option>
        <option value="jpg">JPEG</option>
        <option value="webp">WebP</option>
      </select>
    </label>

    <button class="primary" id="go" type="submit" disabled>Enhance</button>
    <div class="bar"><div id="bar"></div></div>
    <div class="status" id="status">Choose a photo to begin.</div>
  </form>

  <section>
    <div id="drop" tabindex="0" role="button">
      <div><strong>Drop a photo here</strong>or click to choose · JPEG, PNG, WebP, TIFF</div>
    </div>
    <input type="file" id="file" accept="image/*" hidden>
    <div id="viewer">
      <div class="compare" id="compare">
        <img id="after" alt="Enhanced">
        <div class="before"><img id="before" alt="Original"></div>
        <div class="handle" id="handle"></div>
        <span class="tag l">Before</span><span class="tag r" id="after-tag">Original</span>
      </div>
      <div class="toolbar">
        <span id="meta"></span>
        <span class="spacer"></span>
        <button type="button" id="another">Choose another</button>
        <a class="dl" id="download" aria-disabled="true" download>Download</a>
      </div>
    </div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const form = $("form"), fileInput = $("file"), drop = $("drop");
let file = null, origSize = null, info = null, resultUrl = null, sourceUrl = null;

const PRESETS = {
  upscale:  { denoise: 0,    white_balance: 0,   contrast: 0,    saturation: 0,    sharpen: 0 },
  auto:     { denoise: 0.15, white_balance: 0.3, contrast: 0.35, saturation: 0.1,  sharpen: 0.15 },
  old:      { denoise: 0.45, white_balance: 0.6, contrast: 0.5,  saturation: 0.15, sharpen: 0.2 },
  lowlight: { denoise: 0.6,  white_balance: 0.3, contrast: 0.7,  saturation: 0.05, sharpen: 0.1 },
};

function syncVals() {
  form.querySelectorAll("input[type=range]").forEach((r) => {
    const v = parseFloat(r.value);
    r.parentElement.querySelector(".val").textContent = (r.min < 0 && v > 0 ? "+" : "") + Math.round(v * 100) + "%";
  });
}
form.addEventListener("input", syncVals);
document.querySelectorAll("[data-preset]").forEach((b) => b.addEventListener("click", () => {
  for (const [k, v] of Object.entries(PRESETS[b.dataset.preset])) form.elements[k].value = v;
  syncVals();
}));
syncVals();

function describeModel() {
  const key = $("model").value;
  const m = info?.models.find((x) => x.key === key);
  $("model-desc").textContent = m
    ? m.description + (m.downloaded ? "" : " Downloads once on first use.")
    : key === "classic" ? "Traditional resampling. No AI, always available." : "";
}

async function loadInfo() {
  info = await (await fetch("/api/info")).json();
  const sel = $("model");
  for (const m of info.models) sel.add(new Option(m.name, m.key, false, m.key === info.default_model));
  sel.add(new Option("Classic (no AI)", "classic", false, info.default_model === "classic"));
  if (!info.ai_available) {
    for (const o of sel.options) if (o.value !== "classic") o.disabled = true;
    $("env").textContent = "Runs entirely on this computer · AI models need PyTorch: pip install 'photo-enhancer[ai]'";
  } else {
    $("env").textContent = `Runs entirely on this computer · ${info.device.toUpperCase()}`;
  }
  sel.addEventListener("change", describeModel);
  describeModel();
}

function setStatus(text, error = false) {
  $("status").textContent = text;
  $("status").classList.toggle("error", error);
}

function pick(f) {
  if (!f || !f.type.startsWith("image/")) return setStatus("That doesn't look like an image.", true);
  file = f;
  if (sourceUrl) URL.revokeObjectURL(sourceUrl);
  sourceUrl = URL.createObjectURL(f);
  $("before").src = sourceUrl;
  $("after").src = sourceUrl;
  $("after-tag").textContent = "Original";
  $("download").setAttribute("aria-disabled", "true");
  const probe = new Image();
  probe.onload = () => { origSize = [probe.naturalWidth, probe.naturalHeight]; $("meta").textContent = `${f.name} · ${origSize[0]}×${origSize[1]}`; };
  probe.src = sourceUrl;
  drop.style.display = "none";
  $("viewer").style.display = "block";
  $("go").disabled = false;
  setStatus("Ready. Adjust settings, then Enhance.");
}

drop.addEventListener("click", () => fileInput.click());
drop.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") fileInput.click(); });
$("another").addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", () => pick(fileInput.files[0]));
["dragenter", "dragover"].forEach((t) => document.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach((t) => document.addEventListener(t, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
document.addEventListener("drop", (e) => pick(e.dataTransfer.files[0]));
document.addEventListener("paste", (e) => { const f = [...e.clipboardData.files][0]; if (f) pick(f); });

// Before/after slider
const compare = $("compare");
function slide(clientX) {
  const r = compare.getBoundingClientRect();
  const p = Math.min(1, Math.max(0, (clientX - r.left) / r.width)) * 100;
  compare.querySelector(".before").style.clipPath = `inset(0 ${100 - p}% 0 0)`;
  $("handle").style.left = p + "%";
}
compare.addEventListener("pointerdown", (e) => { compare.setPointerCapture(e.pointerId); slide(e.clientX); });
compare.addEventListener("pointermove", (e) => { if (e.buttons) slide(e.clientX); });

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!file) return;
  $("go").disabled = true;
  $("bar").style.width = "0";
  setStatus("Uploading…");
  const body = new FormData(form);
  body.append("file", file);
  try {
    const res = await fetch("/api/jobs", { method: "POST", body });
    let job = await res.json();
    if (!res.ok) throw new Error(job.detail || "Request failed");
    while (job.status === "queued" || job.status === "running") {
      setStatus(`${job.stage}…`);
      $("bar").style.width = job.progress * 100 + "%";
      await new Promise((r) => setTimeout(r, 400));
      job = await (await fetch(`/api/jobs/${job.id}`)).json();
    }
    if (job.status === "error") throw new Error(job.error);
    const blob = await (await fetch(`/api/jobs/${job.id}/result`)).blob();
    if (resultUrl) URL.revokeObjectURL(resultUrl);
    resultUrl = URL.createObjectURL(blob);
    $("after").src = resultUrl;
    $("after-tag").textContent = "Enhanced";
    const ext = { "image/png": "png", "image/jpeg": "jpg", "image/webp": "webp" }[blob.type] || "png";
    const dl = $("download");
    dl.href = resultUrl;
    dl.download = file.name.replace(/\.[^.]+$/, "") + "_enhanced." + ext;
    dl.setAttribute("aria-disabled", "false");
    $("bar").style.width = "100%";
    $("meta").textContent = `${file.name} · ${origSize?.join("×")} → ${job.width}×${job.height}`;
    setStatus(`Done in ${job.seconds}s. Drag across the image to compare.`);
  } catch (err) {
    setStatus(err.message, true);
  } finally {
    $("go").disabled = false;
  }
});

loadInfo().catch(() => setStatus("Could not reach the local server.", true));
</script>
</body>
</html>
